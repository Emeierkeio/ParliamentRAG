# Configurazione della pipeline notturna. Ogni fonte ha la sua sezione: aggiungerne una è aggiungere un connettore e una sezione.

[giro]
timeout_minuti = 300          # oltre questo i download non partono più; trasformazioni, controlli e caricamento sì
cartella_dati = "dati"        # lago dei grezzi, stato, uscite (fuori dal repo in produzione)
spazio_minimo_gb = 5          # meno spazio libero di così sul disco dei dati: il giro non parte

[carica]
tempo_minuti = 150            # tempo del caricamento in Postgres: finito questo si ferma fra un file e l'altro e riprende al giro dopo

[senato]
massimo_richieste_giro = 350  # pagine di senato.it in un giro, sommate fra i passi (esiti, Misto, foto): il sito blocca l'IP dopo ~400

[vettori]
dollari_per_notte = 5         # tetto della Batch API di OpenAI per i vettori in 24 ore (stima dai caratteri)

[termini]
attesa_minuti = 20            # quanto si aspettano le risposte della seconda lettura; le altre si raccolgono la notte dopo
frasi_per_notte = 3000         # tetto delle frasi nuove inviate in un giro (circa 1 $ per mille)

[fatti]
giorni = 95                    # si leggono gli argomenti delle sedute di questi ultimi giorni (nuovi o cambiati)
attesa_minuti = 20
argomenti_per_notte = 4000     # tetto delle richieste in un giro (circa 0,6 $ per mille)

[fonti.camera_resoconti]
legislatura = 19
url = "https://documenti.camera.it/apps/commonServices/getDocumento.ashx?sezione=assemblea&tipoDoc=formato_xml&tipologia=stenografico&idNumero={num:04d}&idLegislatura={legislatura}"
pausa_secondi = 0.5           # fra una richiesta e l'altra
tentativi = 3
ricontrolla = 3              # riscarica le ultime sedute: il resoconto recente può cambiare
massimo_per_giro = 100       # sedute nuove per notte: il primo caricamento della XIX si completa in poche notti

[fonti.camera_ocd]
legislatura = 19
pausa_secondi = 0.5           # fra una pagina e l'altra della stessa query

[fonti.camera_voti]
legislatura = 19
pausa_secondi = 0.5
ricontrolla = 3               # le ultime sedute: la Camera completa i dati nei giorni dopo
massimo_per_giro = 1000       # primo giro: circa 700 sedute, un'ora scarsa

[fonti.camera_atti]
legislatura = 19
pausa_secondi = 0.5

[fonti.camera_governo]
legislatura = 19
inizio_legislatura = "20221013"   # per includere i governi ancora in carica all'inizio della legislatura
pausa_secondi = 0.5

[fonti.camera_bollettino]
legislatura = 19
pausa_secondi = 1.0           # pagine HTML del sito: una al secondo
ricontrolla_giorni = 3        # gli ultimi Bollettini si completano nei giorni dopo
massimo_giorni_per_giro = 90  # primo caricamento: circa 750 giorni in 8 notti (30 giorni = 22 minuti; tempo massimo del passo 90)

[fonti.camera_stenografici_commissioni]
legislatura = 19
primo_mese = 202210           # primo mese con sedute di commissione
pausa_secondi = 1.0
massimo_per_giro = 200        # primo caricamento: qualche migliaio di stenografici, spalmati su più notti

[fonti.camera_aic]
legislatura = 19
pausa_secondi = 0.5
massimo_mesi_per_giro = 60    # primo giro: tutta la legislatura (circa 49 mesi); poi solo i mesi cambiati

[fonti.camera_webtv]
legislatura = 19
pausa_secondi = 10            # il sito chiede 10 secondi fra le richieste (Crawl-delay)
massimo_per_giro = 100        # pagine evento per notte: il primo caricamento (circa 740) si fa in 8 notti
ricontrolla = 3               # l'indice degli interventi delle ultime sedute si completa nei giorni dopo

[fonti.camera_odg]
legislatura = 19
primo_mese = 202210
pausa_secondi = 1.0
massimo_giorni_per_giro = 60  # ordini del giorno passati per notte (circa 740 in tutto); i futuri si leggono sempre

[fonti.camera_calendario]
legislatura = 19
pausa_secondi = 2.0           # due richieste per notte: la pagina del calendario e il calendario vigente

[fonti.senato_calendario]
legislatura = 19
pausa_secondi = 3.0
massimo_richieste = 3         # una pagina per notte, con il browser (senato.it sta dietro il WAF)

[fonti.camera_documenti]
legislatura = 19
pausa_secondi = 1.0
massimo_file_per_giro = 800   # file nuovi per giro (8.064 in tutto): un tetto basso, perché il giro scarica anche le altre fonti della Camera

[fonti.camera_dossier]
legislatura = 19
pausa_secondi = 1.0
massimo_per_giro = 300        # dossier nuovi per notte (circa 3.600 in tutto): il primo caricamento in 12 notti

[fonti.camera_emendamenti]
legislatura = 19
pausa_secondi = 0.5
massimo_per_giro = 4000       # richieste per notte: i file già scaricati costano un 304 se non sono cambiati

[fonti.camera_testi]
legislatura = 19
pausa_secondi = 1.0
massimo_per_giro = 500        # versioni nuove per notte (circa 3.900 in tutto): il primo caricamento in 8 notti

[fonti.senato_osr]
legislatura = 19
pausa_secondi = 5             # dati.senato.it: richieste lente, senato.it blocca l'IP dopo ~400 richieste ravvicinate

[fonti.senato_misto]
legislatura = 19
did = 9                       # il Gruppo Misto della XIX su senato.it
file_import = "dati/import/senato_misto_storica.html"   # pagina salvata a mano dal browser (è dietro il WAF), solo se il lago non ne ha; relativa alla radice del repo

[fonti.senato_esiti]
legislatura = 19
file_import = "dati/import/senato_esiti.csv"   # base: esiti estratti l'8/10/2026 dalle schede dei ddl su senato.it (relativa alla radice del repo)
massimo_richieste = 150       # pagine di senato.it per giro: il sito blocca l'IP dopo ~400 richieste ravvicinate
pausa_secondi = 3
giorni_ricontrollo = 7        # le letture in esame in commissione si ricontrollano dopo una settimana

[fonti.senato_foto]
legislatura = 19
massimo_richieste = 50

[fonti.senato_voti]
legislatura = 19
pausa_secondi = 5             # senato.it blocca l'IP dopo ~400 richieste ravvicinate
massimo_sedute_per_giro = 500 # il tetto vero è sulle richieste
massimo_richieste_per_giro = 150  # circa 45 votazioni per richiesta: la legislatura ne chiede qualche centinaio, su più notti
ricontrolla = 5               # i voti delle ultime sedute arrivano in ritardo

[fonti.senato_ddl]
legislatura = 19
pausa_secondi = 5

[fonti.camera_atti_governo]
legislatura = 19               # atti del Governo e nomine sottoposti a parere: una pagina, una richiesta per notte

[fonti.senato_atti_governo]
legislatura = 19               # gli stessi atti dagli open data del Senato (non tocca senato.it): due query
pausa_secondi = 5

[fonti.camera_convocazioni]
legislatura = 19               # convocazioni delle 14 commissioni permanenti, da oggi in poi: circa 60 richieste per notte
pausa_secondi = 1.0
massimo_per_giro = 150

[fonti.senato_convocazioni]
legislatura = 19               # una pagina per commissione (10), con il browser: contano nel tetto di senato.it
pausa_secondi = 4.0
massimo_richieste = 12

[fonti.senato_odg]
legislatura = 19               # ordine del giorno dell'Aula del Senato: una pagina per notte, con il browser
pausa_secondi = 3.0
massimo_richieste = 3

[fonti.senato_aic]
legislatura = 19               # sindacato ispettivo del Senato, da dati.camera.it (non tocca senato.it)
pausa_secondi = 0.5
massimo_mesi_per_giro = 60

[fonti.senato_resoconti]
legislatura = 19
cartella_import = "dati/import/senate_xml"       # resoconti AKN già scaricati dalla pipeline vecchia (relativa alla radice del repo)
pausa_secondi = 2.0
massimo_richieste = 40
ricontrolla = 3                # le ultime sedute si riscaricano: il Senato può correggerle

[fonti.senato_akn]
legislatura = 19
tipi = ["resaula", "sommcomm", "ddlpres", "ddlcomm", "ddlmess", "emend", "emendc"]   # resoconti, sommari, testi dei ddl, emendamenti (GitHub, CC BY 4.0)
cartella_clone = "cache/senato_akn"

[fonti.eurovoc]
pausa_secondi = 1.0           # Ufficio delle pubblicazioni dell'UE: nomi dei temi degli atti, due richieste
