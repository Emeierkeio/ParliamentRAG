<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#264F76"/>
      <stop offset="1" stop-color="#122E49"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed square: the OS applies the rounded-corner mask -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Concentric parliament arcs, centred, cream, depth via opacity -->
  <g stroke="#ECE1CE" stroke-width="34" stroke-linecap="round" fill="none">
    <path d="M 106 326 A 150 150 0 0 1 406 326" opacity="0.55"/>
    <path d="M 154 326 A 102 102 0 0 1 358 326" opacity="0.78"/>
    <path d="M 202 326 A 54 54 0 0 1 310 326" opacity="1"/>
  </g>
</svg>
