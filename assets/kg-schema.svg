<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 720" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7d8492"/>
    </marker>
    <style>
      .node { rx: 10; }
      .lbl  { font-size: 15px; font-weight: 600; fill: #1f2a44; }
      .cnt  { font-size: 11px; fill: #7d8492; }
      .edge { stroke: #7d8492; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
      .edashed { stroke-dasharray: 5 4; }
      .elbl { font-size: 10.5px; fill: #5b6270; letter-spacing: .02em; }
      .eprop { font-size: 9.5px; fill: #9aa0ab; font-style: italic; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#ffffff"/>

  <!-- ====== proceedings spine (amber) ====== -->
  <g>
    <rect class="node" x="70" y="40"  width="160" height="48" rx="10" fill="#fdf1e3" stroke="#c87f2f"/>
    <text class="lbl" x="150" y="61" text-anchor="middle">Session</text>
    <text class="cnt" x="150" y="77" text-anchor="middle">697</text>

    <rect class="node" x="70" y="140" width="160" height="48" rx="10" fill="#fdf1e3" stroke="#c87f2f"/>
    <text class="lbl" x="150" y="161" text-anchor="middle">Debate</text>
    <text class="cnt" x="150" y="177" text-anchor="middle">6,958</text>

    <rect class="node" x="70" y="240" width="160" height="48" rx="10" fill="#fdf1e3" stroke="#c87f2f"/>
    <text class="lbl" x="150" y="261" text-anchor="middle">Phase</text>
    <text class="cnt" x="150" y="277" text-anchor="middle">9,095</text>

    <rect class="node" x="70" y="340" width="160" height="48" rx="10" fill="#fdf1e3" stroke="#c87f2f"/>
    <text class="lbl" x="150" y="361" text-anchor="middle">Speech</text>
    <text class="cnt" x="150" y="377" text-anchor="middle">45,907</text>

    <rect class="node" x="70" y="470" width="160" height="48" rx="10" fill="#fdf1e3" stroke="#c87f2f"/>
    <text class="lbl" x="150" y="491" text-anchor="middle">Chunk</text>
    <text class="cnt" x="150" y="507" text-anchor="middle">171,624 · vector-indexed</text>

    <line class="edge" x1="150" y1="88"  x2="150" y2="136"/>
    <text class="elbl" x="158" y="116">HAS_DEBATE</text>
    <line class="edge" x1="150" y1="188" x2="150" y2="236"/>
    <text class="elbl" x="158" y="216">HAS_PHASE</text>
    <line class="edge" x1="150" y1="288" x2="150" y2="336"/>
    <text class="elbl" x="158" y="316">CONTAINS_SPEECH</text>
    <line class="edge" x1="150" y1="388" x2="150" y2="466"/>
    <text class="elbl" x="158" y="430">HAS_CHUNK</text>
    <text class="eprop" x="158" y="443">(exact substring of Speech)</text>

    <!-- NEXT self-loop on Chunk -->
    <path class="edge edashed" d="M 70 480 C 30 480, 30 508, 70 508"/>
    <text class="elbl" x="22" y="526">NEXT</text>
  </g>

  <!-- ====== people (blue) with Person super-label ====== -->
  <g>
    <rect x="545" y="278" width="200" height="212" rx="14" fill="none" stroke="#8fa8cc" stroke-dasharray="4 4"/>
    <text class="cnt" x="555" y="294" fill="#3e6db5" font-weight="600">Person</text>

    <rect class="node" x="560" y="304" width="170" height="48" rx="10" fill="#e3ecf8" stroke="#3e6db5"/>
    <text class="lbl" x="645" y="325" text-anchor="middle">Deputy</text>
    <text class="cnt" x="645" y="341" text-anchor="middle">391</text>

    <rect class="node" x="560" y="424" width="170" height="48" rx="10" fill="#e3ecf8" stroke="#3e6db5"/>
    <text class="lbl" x="645" y="445" text-anchor="middle">Gov. Member</text>
    <text class="cnt" x="645" y="461" text-anchor="middle">64</text>
  </g>

  <!-- SPOKEN_BY: Speech -> Person (covers deputies and government members) -->
  <path id="e-spoken" class="edge" d="M 230 364 L 541 364"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-spoken" href="#e-spoken" startOffset="50%">SPOKEN_BY</textPath></text>

  <!-- MENTIONS: Chunk -> Person (NER-resolved), enters the Person box from below -->
  <path id="e-mentions" class="edge edashed" d="M 230 504 L 640 504 L 640 494"/>
  <text dy="-4" text-anchor="middle"><textPath xlink:href="#e-mentions" href="#e-mentions" startOffset="48%"><tspan class="elbl">MENTIONS </tspan><tspan class="eprop">(NER-resolved)</tspan></textPath></text>

  <!-- CITES: Chunk -> Parl. Act, routed along the top margin (NER-resolved) -->
  <path id="e-cites" class="edge edashed" d="M 70 474 L 44 474 L 44 24 L 645 24 L 645 56"/>
  <text dy="-4" text-anchor="middle"><textPath xlink:href="#e-cites" href="#e-cites" startOffset="68%"><tspan class="elbl">CITES </tspan><tspan class="eprop">(NER-resolved)</tspan></textPath></text>

  <!-- ====== acts (green) + eurovoc (teal) ====== -->
  <g>
    <rect class="node" x="560" y="60" width="170" height="48" rx="10" fill="#e4f2e6" stroke="#4e9a5e"/>
    <text class="lbl" x="645" y="81" text-anchor="middle">Parl. Act</text>
    <text class="cnt" x="645" y="97" text-anchor="middle">32,976 · LOD URIs</text>

    <rect class="node" x="900" y="60" width="190" height="48" rx="10" fill="#dff1f0" stroke="#3d9188"/>
    <text class="lbl" x="995" y="81" text-anchor="middle">EuroVoc Concept</text>
    <text class="cnt" x="995" y="97" text-anchor="middle">1,716</text>
  </g>
  <path id="e-primary" class="edge" d="M 612 304 L 612 112"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-primary" href="#e-primary" startOffset="50%">PRIMARY_SIGNATORY</textPath></text>
  <path id="e-cosign" class="edge edashed" d="M 688 304 L 688 112"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-cosign" href="#e-cosign" startOffset="50%">CO_SIGNATORY</textPath></text>
  <path id="e-discusses" class="edge edashed" d="M 230 158 L 500 158 L 500 90 L 556 90"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-discusses" href="#e-discusses" startOffset="34%">DISCUSSES</textPath></text>
  <path id="e-subject" class="edge" d="M 730 84 L 896 84"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-subject" href="#e-subject" startOffset="50%">HAS_SUBJECT</textPath></text>

  <!-- ====== organisations (slate) ====== -->
  <g>
    <rect class="node" x="980" y="220" width="200" height="48" rx="10" fill="#eceef2" stroke="#6b7686"/>
    <text class="lbl" x="1080" y="241" text-anchor="middle">Parl. Group</text>
    <text class="cnt" x="1080" y="257" text-anchor="middle">11</text>

    <rect class="node" x="980" y="300" width="200" height="44" rx="10" fill="#eceef2" stroke="#6b7686"/>
    <text class="lbl" x="1080" y="319" text-anchor="middle" font-size="14">Misto Component</text>
    <text class="cnt" x="1080" y="334" text-anchor="middle">5</text>

    <rect class="node" x="980" y="384" width="200" height="48" rx="10" fill="#eceef2" stroke="#6b7686"/>
    <text class="lbl" x="1080" y="405" text-anchor="middle">Committee</text>
    <text class="cnt" x="1080" y="421" text-anchor="middle">80</text>

    <rect class="node" x="980" y="468" width="200" height="48" rx="10" fill="#eceef2" stroke="#6b7686"/>
    <text class="lbl" x="1080" y="489" text-anchor="middle">Government</text>
    <text class="cnt" x="1080" y="505" text-anchor="middle">HOLDS_OFFICE dated</text>
  </g>

  <!-- Deputy -> Parl. Group: up-lane just right of the Person box, label on the long run -->
  <path id="e-group" class="edge" d="M 730 312 L 760 312 L 760 244 L 976 244"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-group" href="#e-group" startOffset="66%">MEMBER_OF_GROUP</textPath></text>
  <text class="eprop" dy="12" text-anchor="middle"><textPath xlink:href="#e-group" href="#e-group" startOffset="66%">(start_date, end_date)</textPath></text>
  <!-- Deputy -> Misto Component (straight) -->
  <path id="e-component" class="edge edashed" d="M 730 328 L 976 328"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-component" href="#e-component" startOffset="50%">MEMBER_OF_COMPONENT</textPath></text>
  <!-- Deputy -> Committee: down-lane, label on the long run -->
  <path id="e-committee" class="edge" d="M 730 344 L 770 344 L 770 400 L 976 400"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-committee" href="#e-committee" startOffset="66%">MEMBER_OF_COMMITTEE</textPath></text>
  <text class="eprop" dy="12" text-anchor="middle"><textPath xlink:href="#e-committee" href="#e-committee" startOffset="66%">(start_date, end_date, role)</textPath></text>
  <!-- Gov. Member -> Government: down-lane, label on the long run -->
  <path id="e-office" class="edge" d="M 730 448 L 770 448 L 770 492 L 976 492"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-office" href="#e-office" startOffset="64%">HOLDS_OFFICE</textPath></text>
  <text class="eprop" dy="12" text-anchor="middle"><textPath xlink:href="#e-office" href="#e-office" startOffset="64%">(office_type, start_date, end_date)</textPath></text>

  <!-- ====== votes (rose) ====== -->
  <g>
    <rect class="node" x="400" y="600" width="170" height="48" rx="10" fill="#fbe7e9" stroke="#c4485a"/>
    <text class="lbl" x="485" y="621" text-anchor="middle">Vote</text>
    <text class="cnt" x="485" y="637" text-anchor="middle">16,787 roll calls</text>

    <rect class="node" x="700" y="600" width="190" height="48" rx="10" fill="#fbe7e9" stroke="#c4485a"/>
    <text class="lbl" x="795" y="621" text-anchor="middle">Individual Vote</text>
    <text class="cnt" x="795" y="637" text-anchor="middle">6,305,481</text>
  </g>

  <!-- Session -> Vote routed down the left margin -->
  <path id="e-hasvote" class="edge" d="M 70 64 L 16 64 L 16 680 L 340 680 L 340 636 L 396 636"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-hasvote" href="#e-hasvote" startOffset="76%">HAS_VOTE</textPath></text>

  <!-- Person -> Individual Vote (down into the top edge of the box) -->
  <path id="e-voted" class="edge" d="M 680 490 L 680 560 L 795 560 L 795 596"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-voted" href="#e-voted" startOffset="57%">VOTED</textPath></text>
  <path id="e-onvote" class="edge" d="M 574 624 L 700 624" style="marker-end: none; marker-start: url(#arr);"/>
  <text class="elbl" dy="-4" text-anchor="middle"><textPath xlink:href="#e-onvote" href="#e-onvote" startOffset="50%">ON_VOTE</textPath></text>

  <!-- footer note -->
  <text class="cnt" x="1180" y="700" text-anchor="end">ParliamentRAG knowledge graph — schema v2 · XIX Legislature · counts as of 2026-07-26</text>
</svg>
