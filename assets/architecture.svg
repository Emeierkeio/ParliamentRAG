<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 512" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7d8492"/>
    </marker>
    <style>
      .card { fill: #fbfaf8; stroke: #e3e1dc; }
      .num  { font-size: 12px; font-weight: 700; fill: #3e6db5; letter-spacing: .06em; }
      .ttl  { font-size: 15px; font-weight: 650; fill: #1f2a44; }
      .sub  { font-size: 11.5px; fill: #7d8492; }
      .lbl  { font-size: 11.5px; fill: #7d8492; font-style: italic; }
      .flow { stroke: #7d8492; stroke-width: 1.4; fill: none; marker-end: url(#aarr); }
    </style>
  </defs>

  <rect width="1240" height="512" fill="#ffffff"/>

  <!-- frontend -->
  <rect class="card" x="170" y="36" width="900" height="112" rx="12"/>
  <text class="num" x="194" y="66">FRONTEND</text>
  <text class="ttl" x="194" y="88">Next.js 16 — App Router · TypeScript · Tailwind v4 · shadcn</text>
  <text class="sub" x="194" y="110">Chat · Search · Rankings · Compass · Timeline · Evaluation</text>
  <text class="sub" x="194" y="128">6 languages · editorial newspaper-style UI</text>

  <line class="flow" x1="620" y1="148" x2="620" y2="212"/>
  <text class="lbl" x="638" y="184">HTTP + Server-Sent Events — 8-step progress stream</text>

  <!-- backend -->
  <rect class="card" x="170" y="216" width="900" height="96" rx="12"/>
  <text class="num" x="194" y="246">BACKEND</text>
  <text class="ttl" x="194" y="268">FastAPI (Python)</text>
  <text class="sub" x="194" y="290">routers: query · chat · search · authority · compass · timeline · history · evaluation · evidence · graph · survey</text>

  <line class="flow" x1="620" y1="312" x2="620" y2="376"/>
  <text class="lbl" x="638" y="348">Bolt</text>

  <!-- graph store -->
  <rect class="card" x="170" y="380" width="900" height="96" rx="12"/>
  <text class="num" x="194" y="410">GRAPH STORE</text>
  <text class="ttl" x="194" y="432">Neo4j 5.15 — knowledge graph + native vector index</text>
  <text class="sub" x="194" y="454">speech chunks · acts · speakers · groups · committees · sessions · votes</text>
</svg>
