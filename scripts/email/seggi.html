<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<!-- Sfondo delle email (Brevo, modelli 2 e 3): seggi dell'emiciclo che
     spuntano da dietro il riquadro bianco, un po' irregolari come in Aula.
     Si rende con scripts/email/intestazione.py in public/email/seggi@2x.png. -->
<style>html, body { margin: 0; background: transparent; } svg { display: block; }</style>
</head><body>
<svg id="seggi" width="600" height="420" viewBox="0 0 600 420"></svg>
<script>
// Pseudo-random fisso: lo stesso disegno a ogni resa.
let seme = 7;
const caso = () => ((seme = (seme * 16807) % 2147483647) / 2147483647);
// Tutto l'emiciclo ruotato di qualche grado, perché non sembri uno schema.
const s = document.getElementById("seggi"), cx = 300, cy = 430, giro = -5 * Math.PI / 180;
[250, 288, 326, 364, 402].forEach((r, i) => {
  const passi = Math.round(Math.PI * r / 34);
  for (let k = 0; k <= passi; k++) {
    const a = Math.PI + (Math.PI * (k + (caso() - 0.5) * 0.5)) / passi;
    const rr = r + (caso() - 0.5) * 9, raggio = 10 + (caso() - 0.5) * 3;
    const x = cx + rr * Math.cos(a + giro), y = cy + rr * Math.sin(a + giro);
    // niente seggi tagliati dal bordo dell'immagine
    if (x < raggio + 2 || x > 598 - raggio || y < raggio + 2 || y > 418 - raggio) continue;
    if (caso() < 0.12) continue; // qualche seggio vuoto
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", x.toFixed(1));
    c.setAttribute("cy", y.toFixed(1));
    c.setAttribute("r", raggio.toFixed(1));
    c.setAttribute("fill", caso() < 0.08 ? "#d6d2c6" : "#e9e6dd");
    s.appendChild(c);
  }
});
</script>
</body></html>
