[[voce]]
area = "Atti e leggi"
nome = "Dossier dei servizi di documentazione"
peso = 2
camera = "fatto"
senato = "manca"
perche_senato = "PDF su senato.it, dietro il blocco: stesso limite degli stenografici."
fonti = ["camera_dossier"]
