# Copertura del dominio parlamentare: che cosa pubblicano Camera e Senato e che cosa di questo scarichiamo e modelliamo.
# La legge il pannello /sistema (api/copertura.py), che ne ricava la percentuale e l'elenco di ciò che manca, con il motivo.
#
# Si aggiorna insieme al codice: quando una fonte entra o cambia, si cambia qui lo stato della sua voce (un test controlla
# che ogni fonte di pipeline.toml compaia in una voce). Vale per la legislatura in corso: le precedenti sono fuori.
#
# Una voce:
#   area, nome     dove sta e che cos'è, con le parole dei siti
#   peso           1 = marginale, 2 = utile, 3 = essenziale per seguire i lavori
#   camera, senato "fatto" | "parziale" | "manca" | "non_c_e" (il ramo non lo pubblica: non conta); `parlamento` per le voci comuni
#   perche_camera, perche_senato, perche   perché manca o è parziale, in una frase
#   fonti          i connettori di pipeline.toml che la portano
#   conta          una query che conta le righe nel database ({ramo} = 'camera' o 'senato'): una voce «fatto» senza righe
#                  si vede nel pannello. `conta_camera` e `conta_senato` quando la query cambia fra i rami.

verificato = "2026-11-10"     # l'ultima volta che l'elenco è stato confrontato con i siti dei due rami

# ---------------------------------------------------------------- persone e organi
[[voce]]
area = "Persone e organi"
nome = "Parlamentari, mandati e gruppi"
peso = 3
camera = "fatto"
senato = "fatto"
fonti = ["camera_ocd", "senato_osr"]
conta = "SELECT count(*) FROM mandate WHERE chamber = {ramo}"

[[voce]]
area = "Persone e organi"
nome = "Componenti del Gruppo Misto"
peso = 2
camera = "fatto"
senato = "fatto"
fonti = ["camera_ocd", "senato_misto"]
conta = "SELECT count(*) FROM grp WHERE chamber = {ramo} AND kind = 'misto_component'"

[[voce]]
area = "Persone e organi"
nome = "Commissioni, giunte e altri organi: chi ne fa parte e con quale carica"
peso = 2
camera = "fatto"
senato = "fatto"
fonti = ["camera_ocd", "senato_osr"]
conta = "SELECT count(*) FROM body WHERE chamber = {ramo}"

[[voce]]
area = "Persone e organi"
nome = "Governo: ministri, viceministri e sottosegretari"
peso = 2
parlamento = "fatto"
fonti = ["camera_governo"]
conta = "SELECT count(*) FROM government"

[[voce]]
area = "Persone e organi"
nome = "Foto dei parlamentari"
peso = 1
camera = "fatto"
senato = "fatto"
fonti = ["camera_ocd", "senato_foto"]

[[voce]]
area = "Persone e organi"
nome = "Trasparenza: dichiarazioni patrimoniali, spese elettorali, rendiconti dei gruppi"
peso = 1
camera = "manca"
senato = "manca"
perche = "Sono PDF con dati personali e non servono alle tre garanzie: per scelta non si scaricano."

[[voce]]
area = "Persone e organi"
nome = "Registro dei rappresentanti di interessi"
peso = 1
camera = "manca"
senato = "manca"
perche_camera = "Vista solo la pagina di iscrizione: da verificare se l'elenco degli iscritti è pubblico."
perche_senato = "Non verificato se il Senato ne pubblica uno."

