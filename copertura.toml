conta = "SELECT count(*) FROM convocation WHERE chamber = {ramo}"

[[voce]]
area = "Commissioni"
nome = "Documenti acquisiti: memorie e contributi scritti delle audizioni"
peso = 2
camera = "fatto"
senato = "manca"
perche_senato = "Stanno solo su senato.it, dietro il blocco: stesso limite degli stenografici."
