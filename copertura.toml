[[voce]]
area = "Aula"
nome = "Ordine del giorno"
peso = 2
camera = "fatto"
senato = "manca"
perche_senato = "La pagina c'è (vista il 10/11/2026), sta dietro il blocco di senato.it: connettore da scrivere."
fonti = ["camera_odg"]
conta = "SELECT count(*) FROM sitting WHERE chamber = {ramo} AND kind = 'assembly_agenda'"

[[voce]]
area = "Aula"
nome = "Calendario dei lavori"
peso = 2
camera = "fatto"
senato = "fatto"
fonti = ["camera_calendario", "senato_calendario"]
conta = "SELECT count(*) FROM calendar_item WHERE chamber = {ramo}"

[[voce]]
area = "Aula"
nome = "Votazioni elettroniche, con il voto di ogni parlamentare"
peso = 3
camera = "fatto"
senato = "fatto"
fonti = ["camera_voti", "senato_voti"]
conta = "SELECT count(*) FROM vote WHERE chamber = {ramo}"

[[voce]]
area = "Aula"
nome = "Votazioni senza i nomi (alzata di mano, voto segreto)"
peso = 1
camera = "manca"
senato = "manca"
perche = "L'esito sta solo nel testo del resoconto: serve uno strumento che lo legga da lì."

[[voce]]
area = "Aula"
nome = "Video delle sedute, con i tempi di ogni intervento"
peso = 2
camera = "fatto"
senato = "manca"
perche_senato = "Da verificare se la WebTV del Senato dà i tempi intervento per intervento."
