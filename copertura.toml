conta_camera = "SELECT count(*) FROM document WHERE source = 'camera_documenti'"

[[voce]]
area = "Commissioni"
nome = "Audizioni informali"
peso = 1
camera = "manca"
senato = "manca"
perche = "Esistono solo come video, senza un resoconto ufficiale da citare."

[[voce]]
area = "Commissioni"
nome = "Termini per gli emendamenti"
peso = 2
camera = "fatto"
senato = "fatto"
fonti = ["camera_bollettino", "senato_akn"]
conta = "SELECT count(*) FROM amendment_deadline WHERE chamber = {ramo}"

[[voce]]
area = "Commissioni"
nome = "Audizioni, pareri e risposte alle interrogazioni letti nei sommari"
peso = 2
camera = "parziale"
senato = "parziale"
perche = "Solo gli ultimi tre mesi; iter e pareri sugli emendamenti sono ancora sotto la precisione che serve per mostrarli."
